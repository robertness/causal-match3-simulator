[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-match3-simulator"
version = "0.1.0"
description = "A causal generative match-3 simulator for world-model experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "pyro-ppl>=1.9",
    "pygame>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]
analysis = ["matplotlib>=3.8"]

[project.scripts]
match3-video = "match3_simulator.video:main"
match3-simulate = "match3_simulator.simulate:main"
match3-learn = "match3_simulator.learned_model.experiment:main"
match3-evaluate = "match3_simulator.learned_model.evaluate:main"
match3-release = "match3_simulator.release:main"

[tool.setuptools]
packages = ["match3_simulator", "match3_simulator.learned_model"]

[tool.setuptools.package-dir]
match3_simulator = "."
"match3_simulator.learned_model" = "learned_model"

[tool.setuptools.package-data]
match3_simulator = [
    "accepted_benchmark.json",
    "accepted_calibration.json",
    "calibration.json",
    "win_propensity_calibration.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
